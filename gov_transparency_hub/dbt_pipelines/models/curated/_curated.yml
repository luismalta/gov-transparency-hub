version: 2

models:
  - name: dim_municipio
    columns:
      - name: municipio_sk
        data_tests: [unique, not_null]
      - name: municipio
        data_tests: [unique, not_null]

  - name: dim_unidade_gestora
    columns:
      - name: unidade_gestora_sk
        data_tests: [unique, not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, unidade_gestora]

  - name: dim_unidade_orcamentaria
    columns:
      - name: unidade_orcamentaria_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_funcao
    columns:
      - name: funcao_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_subfuncao
    columns:
      - name: subfuncao_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_programa
    columns:
      - name: programa_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_acao
    description: Projeto/atividade (portal field projetoAtividade).
    columns:
      - name: acao_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_categoria_economica
    columns:
      - name: categoria_economica_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_fonte_recurso
    columns:
      - name: fonte_recurso_sk
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values: {values: [cadastro, fato]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, codigo]

  - name: dim_credor
    description: >
      Creditors parsed from despesa. Individuals carry a CPF already masked by
      the portal, which is not unique, hence the (documento, nome) key.
    columns:
      - name: credor_sk
        data_tests: [unique, not_null]
      - name: credor_tipo_pessoa
        data_tests:
          - accepted_values: {values: [PJ, PF]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [credor_documento, credor_nome]

  - name: dim_data
    columns:
      - name: data_sk
        data_tests: [unique, not_null]
      - name: data
        data_tests: [unique, not_null]

  - name: fct_despesa
    description: >
      One row per (municipio, unidade_gestora, ano_referencia, empenho,
      tipo_codigo, tipo_descricao). WARNING: `valor` is the committed amount for empenhos
      (EO/EE/EG) and the ordered amount for payment orders (OP). Filter by
      `natureza` or `tipo_codigo` before summing: mixing them combines
      committed and paid money and may double count (whether an OP shares
      its number with an EO for the same expense is an open question).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, unidade_gestora, ano_referencia, empenho, tipo_codigo, tipo_descricao]
    columns:
      - name: despesa_sk
        data_tests: [unique, not_null]
      - name: valor
        data_tests: [not_null]
      - name: natureza
        data_tests:
          - accepted_values: {values: [empenho, ordem_pagamento]}
      - name: tipo_codigo
        data_tests:
          - accepted_values:
              values: [EO, EE, EG, OP]
              config: {severity: warn}
      - name: municipio_sk
        data_tests: [not_null, {relationships: {to: ref('dim_municipio'), field: municipio_sk}}]
      - name: unidade_gestora_sk
        data_tests: [not_null, {relationships: {to: ref('dim_unidade_gestora'), field: unidade_gestora_sk}}]
      - name: unidade_orcamentaria_sk
        data_tests: [not_null, {relationships: {to: ref('dim_unidade_orcamentaria'), field: unidade_orcamentaria_sk}}]
      - name: funcao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_funcao'), field: funcao_sk}}]
      - name: subfuncao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_subfuncao'), field: subfuncao_sk}}]
      - name: programa_sk
        data_tests: [not_null, {relationships: {to: ref('dim_programa'), field: programa_sk}}]
      - name: acao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_acao'), field: acao_sk}}]
      - name: categoria_economica_sk
        data_tests: [not_null, {relationships: {to: ref('dim_categoria_economica'), field: categoria_economica_sk}}]
      - name: fonte_recurso_sk
        data_tests: [not_null, {relationships: {to: ref('dim_fonte_recurso'), field: fonte_recurso_sk}}]
      - name: credor_sk
        data_tests: [not_null, {relationships: {to: ref('dim_credor'), field: credor_sk}}]
      - name: data_empenho_sk
        data_tests: [not_null, {relationships: {to: ref('dim_data'), field: data_sk}}]
      - name: data_liquidacao_sk
        data_tests: [{relationships: {to: ref('dim_data'), field: data_sk}}]
      - name: data_pagamento_sk
        data_tests: [{relationships: {to: ref('dim_data'), field: data_sk}}]

  - name: fct_orcamento_despesa
    description: >
      Annual budget per ficha (municipio, ano_referencia, ficha). Snapshot of
      the last raw load: raw upserts per partition, so saldo_atual and
      valor_atualizado reflect the latest load only (no history).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [municipio, ano_referencia, ficha]
    columns:
      - name: orcamento_despesa_sk
        data_tests: [unique, not_null]
      - name: valor_orcado
        data_tests: [not_null]
      - name: municipio_sk
        data_tests: [not_null, {relationships: {to: ref('dim_municipio'), field: municipio_sk}}]
      - name: unidade_orcamentaria_sk
        data_tests: [not_null, {relationships: {to: ref('dim_unidade_orcamentaria'), field: unidade_orcamentaria_sk}}]
      - name: funcao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_funcao'), field: funcao_sk}}]
      - name: subfuncao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_subfuncao'), field: subfuncao_sk}}]
      - name: programa_sk
        data_tests: [not_null, {relationships: {to: ref('dim_programa'), field: programa_sk}}]
      - name: acao_sk
        data_tests: [not_null, {relationships: {to: ref('dim_acao'), field: acao_sk}}]
      - name: categoria_economica_sk
        data_tests: [not_null, {relationships: {to: ref('dim_categoria_economica'), field: categoria_economica_sk}}]

unit_tests:
  - name: fct_despesa_keeps_op_variants_apart
    model: fct_despesa
    description: >
      The cadastro has four tipos with code OP; they share empenho numbers
      within a UG and year, so the grain must include the description.
    given:
      - input: ref('stg_despesa')
        rows:
          - {municipio: tiradentes, unidade_gestora: '1', ano_referencia: '2025', empenho: '1', tipo_codigo: OP, tipo_descricao: 'Ordem de Pagamento', valor: 1.00}
          - {municipio: tiradentes, unidade_gestora: '1', ano_referencia: '2025', empenho: '1', tipo_codigo: OP, tipo_descricao: 'Restos a pagar', valor: 2.00}
      - input: ref('dim_municipio')
        rows: []
      - input: ref('dim_unidade_gestora')
        rows: []
      - input: ref('dim_unidade_orcamentaria')
        rows: []
      - input: ref('dim_funcao')
        rows: []
      - input: ref('dim_subfuncao')
        rows: []
      - input: ref('dim_programa')
        rows: []
      - input: ref('dim_acao')
        rows: []
      - input: ref('dim_categoria_economica')
        rows: []
      - input: ref('dim_fonte_recurso')
        rows: []
      - input: ref('dim_credor')
        rows: []
      - input: ref('dim_data')
        rows: []
    expect:
      rows:
        - {tipo_descricao: 'Ordem de Pagamento', despesa_sk: '825a7d34b9531fdfbce6b91c5cb0758a'}
        - {tipo_descricao: 'Restos a pagar', despesa_sk: '651b38b1df5cdb6504ae959a0285ad98'}

  - name: dim_programa_conformed_members
    model: dim_programa
    given:
      - input: ref('stg_programas')
        rows:
          - {municipio: m, unidade_gestora: '1', ano_referencia: '2025', codigo: '0001', nome: 'GESTAO'}
          - {municipio: m, unidade_gestora: '2', ano_referencia: '2025', codigo: '0001', nome: 'GESTAO'}
          - {municipio: m, unidade_gestora: '3', ano_referencia: '2025', codigo: '0001', nome: 'GESTÃO'}
          - {municipio: m, unidade_gestora: '1', ano_referencia: '2025', codigo: '0002', nome: 'B'}
          - {municipio: m, unidade_gestora: '2', ano_referencia: '2025', codigo: '0002', nome: 'A'}
          - {municipio: m, unidade_gestora: '1', ano_referencia: '2025', codigo: '0003', nome: null}
          - {municipio: m, unidade_gestora: '2', ano_referencia: '2025', codigo: '0003', nome: null}
          - {municipio: m, unidade_gestora: '3', ano_referencia: '2025', codigo: '0003', nome: 'COM NOME'}
          - {municipio: m, unidade_gestora: '1', ano_referencia: '2025', codigo: '0004', nome: null}
      - input: ref('stg_despesa')
        rows:
          - {municipio: m, ano_referencia: '2025', programa_codigo: '0001', programa_nome: 'NOME DO FATO'}
          - {municipio: m, ano_referencia: '2025', programa_codigo: '0004', programa_nome: 'SO NO FATO'}
      - input: ref('stg_orcamento_anual_de_despesa')
        rows:
          - {municipio: m, ano_referencia: '2025', programa_codigo: '0101', programa_nome: 'LEGISLATIVO'}
    expect:
      rows:
        - {codigo: '0001', nome: 'GESTAO', origem: cadastro}
        - {codigo: '0002', nome: 'A', origem: cadastro}
        - {codigo: '0101', nome: 'LEGISLATIVO', origem: fato}
        - {codigo: '0003', nome: 'COM NOME', origem: cadastro}
        - {codigo: '0004', nome: 'SO NO FATO', origem: fato}
