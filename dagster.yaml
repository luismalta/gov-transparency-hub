storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

concurrency:
  runs:
    max_concurrent_runs: 5
  pools:
    # raw_<table> pools: one MERGE at a time per Delta table.
    default_limit: 1

run_retries:
  enabled: true
  max_retries: 3
# Frees pool slots of runs that ended without releasing them (killed or
# canceled from outside); with pool limits of 1 a leaked slot blocks a raw
# table forever. Also marks runs whose worker process died as failed.
run_monitoring:
  enabled: true
  free_slots_after_run_end_seconds: 60
